[project]
name = "mail-dayou-agent"
version = "0.1.0"
description = "阿空大邮 (xiaohua) FC backend · 帮用户生 AI 头像 · 调阿里通义万相"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.0",
  "dashscope>=1.20",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dayou_agent"]
